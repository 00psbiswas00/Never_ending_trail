document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

);\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"62a0bd6f-43bd-45c3-9f47-c1593f3aa74c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"e670317e-4578-4377-b212-fa699ffbad81\"><\u002Fscript>\n<style>\n:root{--indigo:#23325E;--red:#C9372C;--red-on-indigo:#E0503F;--turmeric:#E3A21A;--turmeric-on-indigo:#EDB22A;--cream:#F1E9D8;--paper:#FBF8F1;--ink:#16130F;--display:\"Archivo\",\"Arial Black\",sans-serif;--mono:\"IBM Plex Mono\",\"Courier New\",monospace;--bn:\"Anek Bangla\",sans-serif;--sec:96px}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{background:var(--paper);color:var(--ink);font:400 18px/1.5 var(--display);font-stretch:100%;-webkit-font-smoothing:antialiased}\na{color:var(--red);text-decoration:underline;text-underline-offset:3px;transition:color .15s}\na:hover{color:var(--indigo)}\n:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}\n.on-indigo :focus-visible{outline-color:var(--turmeric-on-indigo)}\n.wrap{max-width:1280px;margin:0 auto;padding:0 40px}\n.disp{font-family:var(--display);font-stretch:125%;font-weight:800;text-transform:uppercase;line-height:1.02;letter-spacing:0}\n.label{font:600 14px/1.2 var(--mono);text-transform:uppercase;letter-spacing:3px}\n.tag{display:inline-flex;font:600 14px/1 var(--mono);letter-spacing:3px;text-transform:uppercase;background:var(--turmeric);color:var(--indigo);padding:8px 10px}\n.on-indigo .tag.bare{background:none;color:var(--turmeric-on-indigo);padding:0}\n.btn{display:inline-flex;align-items:center;font:600 16px/1 var(--display);padding:16px 24px;text-decoration:none;border:2px solid var(--red);background:var(--red);color:var(--paper);transition:background .15s,border-color .15s,color .15s}\n.btn:hover{background:var(--indigo);border-color:var(--indigo);color:var(--paper)}\n.btn.ghost{background:none;color:var(--indigo);border-color:var(--indigo)}\n.btn.ghost:hover{background:var(--indigo);color:var(--cream)}\n.on-indigo .btn.ghost{color:var(--cream);border-color:var(--cream)}\n.on-indigo .btn.ghost:hover{background:var(--cream);color:var(--indigo)}\n/* header */\nheader{background:var(--paper);border-bottom:2px solid var(--indigo)}\nheader .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;height:88px}\n.lockup{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--indigo)}\n.lockup img{height:48px;width:auto;display:block}\nnav{display:flex;align-items:center;gap:32px}\nnav a.nl{color:var(--indigo);text-decoration:none;font-weight:600;font-size:16px;border-bottom:2px solid transparent;padding:4px 0;transition:border-color .15s}\nnav a.nl:hover{border-color:var(--red)}\n/* hero */\n.hero{background:var(--indigo);color:var(--cream);padding:var(--sec) 0}\n.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:64px;align-items:center}\n.hero h1{font-size:84px;margin:24px 0 28px;text-wrap:balance}\n.hero p{max-width:30em;font-size:18px;color:var(--cream)}\n.hero .bn{font-family:var(--bn);font-weight:500;display:block;margin-top:8px}\n.hero .ctas{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap}\n.hero .btn{background:var(--cream);border-color:var(--cream);color:var(--indigo)}\n.hero .btn:hover{background:var(--turmeric-on-indigo);border-color:var(--turmeric-on-indigo)}\n.frame{border:8px solid var(--indigo);background:var(--cream);position:relative}\n.hero .frame{border-color:var(--cream);aspect-ratio:4/3}\n.hero-art{position:relative}\n.hero-art .sun{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--turmeric-on-indigo);top:-32px;right:64px;z-index:2}\n.hero-art .cap{display:flex;justify-content:space-between;margin-top:16px;color:var(--cream)}\n/* route divider */\n.route{display:block;width:100%;height:56px;overflow:visible}\n/* about */\n.about{padding:var(--sec) 0 0}\n.about .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:64px}\n.about h2{font:600 36px/1.2 var(--display);color:var(--indigo);max-width:22em;text-wrap:pretty}\n.about .modes{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:32px;color:var(--indigo)}\n/* trips */\n.trips{padding:var(--sec) 0}\n.sec-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:48px}\n.sec-head .disp{font-size:56px;color:var(--indigo)}\n.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 32px}\n.card{display:flex;flex-direction:column;gap:16px;text-decoration:none;color:var(--ink)}\n.card .frame{aspect-ratio:1/1;border-width:6px;transition:border-color .15s}\n.card:hover .frame{border-color:var(--red)}\n.card h3{font:600 24px/1.25 var(--display);color:var(--indigo)}\n.card p{font-size:16px;color:var(--ink)}\n.card .meta{color:var(--indigo)}\n/* scroll strip */\n.scroll{background:var(--cream);padding:var(--sec) 0;border-top:2px solid var(--indigo);border-bottom:2px solid var(--indigo)}\n.scroll .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:64px;align-items:center}\n.scroll h2{font-size:56px;color:var(--indigo);margin:20px 0 24px}\n.scroll p{max-width:34em}\n.scroll p+p{margin-top:16px}\n.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:6px solid var(--indigo)}\n.panels > div{aspect-ratio:3/4;border-right:6px solid var(--indigo);position:relative}\n.panels > div:last-child{border-right:0}\n.panels .n{position:absolute;left:8px;bottom:8px;z-index:2;pointer-events:none}\n/* join */\n.join{padding:var(--sec) 0;text-align:left}\n.join .wrap{display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap}\n.join h2{font-size:56px;color:var(--indigo)}\n.join p{margin-top:16px;max-width:32em}\n/* footer */\nfooter{background:var(--indigo);color:var(--cream);padding:72px 0 40px}\nfooter .top{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:40px}\nfooter .flogo{display:block;width:100%;max-width:360px;height:auto}\nfooter ul{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:16px}\nfooter a{color:var(--cream)}\nfooter a:hover{color:var(--turmeric-on-indigo)}\nfooter .h{color:var(--turmeric-on-indigo)}\nfooter .bot{display:flex;justify-content:space-between;gap:24px;margin-top:64px;padding-top:24px;border-top:2px solid rgba(241,233,216,.25);font-size:16px;flex-wrap:wrap}\n@media (max-width:768px){\n:root{--sec:56px}\nbody{font-size:16px}\n.wrap{padding:0 20px}\nheader .wrap{height:72px}\n.lockup img{height:40px}\nnav{gap:16px}nav a.nl{display:none}\n.btn{padding:14px 18px;font-size:15px}\n.label,.tag{font-size:12px}\n.hero .wrap,.about .wrap,.scroll .wrap{grid-template-columns:minmax(0,1fr);gap:40px}\n.hero h1{font-size:40px}\n.about h2{font-size:26px}\n.sec-head .disp,.scroll h2,.join h2{font-size:32px}\n.sec-head{flex-direction:column;align-items:start}\n.grid{grid-template-columns:minmax(0,1fr)}\n.card h3{font-size:20px}\nfooter .top{grid-template-columns:minmax(0,1fr)}\n}\n@media (min-width:769px) and (max-width:1100px){.hero h1{font-size:60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.h2dot{display:flex;align-items:center;gap:16px;font:600 36px/1.2 var(--display);color:var(--indigo)}\n.h2dot::before{content:\"\";width:20px;height:20px;border-radius:50%;background:var(--turmeric);flex:none}\n.trips .sec-head{align-items:center;margin-bottom:32px}\n.stops{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;height:40px;margin-bottom:32px}\n.stops::before{content:\"\";position:absolute;left:0;right:48px;top:50%;height:4px;margin-top:-2px;background:var(--red);border-radius:2px}\n.stops::after{content:\"\";position:absolute;right:0;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--red);box-shadow:-22px 0 0 var(--red)}\n.stops span{position:relative;justify-self:center;align-self:center;width:28px;height:28px;border-radius:50%;border:4px solid var(--indigo);background:var(--paper)}\n.stops span.now{background:var(--turmeric)}\n.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}\n.tcard{display:flex;flex-direction:column;border:4px solid var(--indigo);background:var(--paper);transition:border-color .15s}\n.tcard:hover{border-color:var(--red)}\n.tcard .ph{aspect-ratio:4/3;border-bottom:4px solid var(--indigo)}\n.tcard .bd{background:var(--cream);padding:32px;display:flex;flex-direction:column;gap:16px;flex:1}\n.tcard h3{font:600 24px/1.25 var(--display);color:var(--indigo)}\n.tcard p{font-size:16px}\n.tcard a{font-weight:600;font-size:16px;margin-top:auto}\n.tell{padding:0 0 var(--sec)}\n.tell .h2dot{margin-bottom:48px}\n.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}\n.chan{border:4px solid var(--indigo);padding:32px;display:flex;flex-direction:column;gap:16px}\n.chan .ph{aspect-ratio:16/9;border:2px solid var(--indigo);margin-bottom:8px}\n.chan .ic{height:56px;display:flex;align-items:center}\n.chan .lbl{color:var(--indigo)}\n.chan h3{font:600 24px/1.25 var(--display);color:var(--indigo)}\n.chan p{font-size:16px}\n.chan a{font-weight:600;font-size:16px;margin-top:auto}\n@media (max-width:1100px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stops{display:none}.cgrid{grid-template-columns:minmax(0,1fr)}.chan{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px}.chan .ph{grid-row:span 6;margin:0}}\n@media (max-width:768px){.h2dot{font-size:26px}.stops{display:none}.tgrid{grid-template-columns:minmax(0,1fr)}.tcard .bd,.chan{padding:24px}.tcard h3,.chan h3{font-size:20px}.chan{display:flex}}\n<\u002Fstyle>\n<style>.stops::before,.nstops::before{transform-origin:left center;transform:scaleX(0);transition:transform 1.4s cubic-bezier(.3,.6,.3,1)}\n.stops::after,.nstops::after{opacity:0;transition:opacity .2s 1.4s}\n.stops span,.nstops span{transition:background-color .2s,border-color .2s}\n.stops span{border-color:var(--cream)!important;background:var(--paper)!important}\n.nstops span{border-color:rgba(241,233,216,.25)!important;background:var(--indigo)!important}\n.stops.in::before,.nstops.in::before{transform:scaleX(1)}\n.stops.in::after,.nstops.in::after{opacity:1}\n.stops.in span,.nstops.in span{border-color:var(--indigo)!important}\n.nstops.in span{border-color:var(--cream)!important}\n.stops.in span.now{background:var(--turmeric)!important}\n.nstops.in span.now{background:var(--turmeric-on-indigo)!important}\n.stops.in span:nth-child(1),.nstops.in span:nth-child(1){transition-delay:.2s}\n.stops.in span:nth-child(2),.nstops.in span:nth-child(2){transition-delay:.65s}\n.stops.in span:nth-child(3),.nstops.in span:nth-child(3){transition-delay:1.1s}\n.route path{stroke-dasharray:1600;stroke-dashoffset:1600;transition:stroke-dashoffset 1.6s ease-out}\n.route circle{opacity:0;transition:opacity .2s 1.4s}\n.route.in path{stroke-dashoffset:0}\n.route.in circle{opacity:1}\n.flow{display:block;width:100%;height:40px;overflow:visible}\n.flow path{stroke-dasharray:var(--len,3000);stroke-dashoffset:var(--len,3000);transition:stroke-dashoffset 1.6s ease-out}\n.flow circle{opacity:0;transition:opacity .2s 1.4s}\n.flow.in path{stroke-dashoffset:0}.flow.in circle{opacity:1}\n.trail{position:relative;height:24px}\n.trail::before{content:\"\";position:absolute;left:0;right:56px;top:50%;height:6px;margin-top:-3px;background:var(--red);border-radius:3px;transform-origin:left center;transform:scaleX(0);transition:transform 1.4s cubic-bezier(.3,.6,.3,1)}\n.trail::after{content:\"\";position:absolute;right:0;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--red);box-shadow:-26px 0 0 var(--red);opacity:0;transition:opacity .2s 1.4s}\n.trail.in::before{transform:scaleX(1)}.trail.in::after{opacity:1}\n.tcard,.chan,.ncard .ph,.card .frame,.feature .frame{transition:border-color .18s}\n.tcard,.chan{position:relative;cursor:pointer}\n.tcard::after,.chan::after{content:\"\";position:absolute;left:-4px;right:-4px;bottom:-4px;height:8px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .2s ease-out}\n.tcard:hover,.chan:hover{border-color:var(--red)}\n.tcard:hover::after,.chan:hover::after{transform:scaleX(1)}\n.tcard:hover .ph{border-color:var(--red)}\n.chan:hover .ph{border-color:var(--red)}\n.tcard h3,.chan h3,.card h3,.feature h2,.ncard h3{transition:color .18s}\n.tcard:hover h3,.chan:hover h3,.card:hover h3,.feature:hover h2{color:var(--red)}\n.card:hover .frame,.feature:hover .frame{border-color:var(--red)}\n.card .frame::after,.feature .frame::after{content:\"\";position:absolute;left:-8px;right:-8px;bottom:-8px;height:8px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .2s ease-out;z-index:2}\n.card:hover .frame::after,.feature:hover .frame::after{transform:scaleX(1)}\n.ncard:hover .ph{border-color:var(--turmeric-on-indigo)}\n.ncard:hover h3{color:var(--turmeric-on-indigo)}\n.tcard a,.chan a{text-decoration-thickness:1px;transition:color .18s,text-decoration-thickness .18s}\n.tcard:hover a,.chan:hover a{text-decoration-thickness:2px}\n@media (prefers-reduced-motion:reduce){.stops::before,.nstops::before,.trail::before{transform:none;transition:none}.trail::after{opacity:1;transition:none}.stops::after,.nstops::after,.route circle{opacity:1;transition:none}.route path,.flow path{stroke-dashoffset:0;transition:none}.flow circle{opacity:1;transition:none}.stops span,.nstops span{transition:none}.tcard::after,.chan::after,.card .frame::after,.feature .frame::after{transition:none}}\n<\u002Fstyle>\n<script src=\"dd5bc524-38a9-4587-840c-10fdc8957afd\" defer=\"\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<header>\n<div class=\"wrap\">\n<a class=\"lockup\" href=\"#\"><img src=\"652f02ed-1445-43e4-a957-2b4e48b5ea0d\" alt=\"Never Ending Trail Club\"><\u002Fa>\n<nav><a class=\"nl\" href=\"#trips\">Trips<\u002Fa><a class=\"nl\" href=\"Stories.html\">Stories<\u002Fa><a class=\"nl\" href=\"About.html\">About us<\u002Fa><a class=\"btn\" href=\"Join.html\">Join a trip<\u002Fa><\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n<section class=\"hero on-indigo\" data-screen-label=\"Hero\">\n<div class=\"wrap\">\n<div>\n<span class=\"tag\">Trip 12 · [Place]<\u002Fspan>\n<h1 class=\"disp\">Every trip is a frame.<\u002Fh1>\n<p>We are a group of Bengali friends who travel anywhere, by any means. Every trip becomes one panel of a scroll that keeps going.<span class=\"bn\">প্রতিটি যাত্রা একটি ফ্রেম।<\u002Fspan><\u002Fp>\n<div class=\"ctas\"><a class=\"btn\" href=\"Story.html\">Read the story<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hero-art\">\n<div class=\"sun\" aria-hidden=\"true\"><\u002Fdiv>\n<div class=\"frame\"><image-slot id=\"hero-trip12\" shape=\"rect\" placeholder=\"Group photo from Trip 12\"><\u002Fimage-slot><\u002Fdiv>\n<div class=\"cap label\"><span>Trip 12 · [Place]<\u002Fspan><span>[Date]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"about\" data-screen-label=\"Who we are\">\n<div class=\"wrap\">\n<div class=\"label\" style=\"color:var(--indigo)\">01 / Who we are<\u002Fdiv>\n<div>\n<h2>A travel club, not a company. We go together, we get lost together, and we tell it the way it happened.<\u002Fh2>\n<div class=\"modes label\"><span>Bike<\u002Fspan><span>Train<\u002Fspan><span>Road<\u002Fspan><span>Boat<\u002Fspan><span>Plane<\u002Fspan><span>Mountains<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<div class=\"wrap\" aria-hidden=\"true\" style=\"padding-top:56px\"><svg class=\"flow\" aria-hidden=\"true\"><\u002Fsvg><\u002Fdiv>\n<section class=\"trips\" id=\"trips\" data-screen-label=\"Trips\">\n<div class=\"wrap\">\n<div class=\"sec-head\"><h2 class=\"h2dot\">Latest trips<\u002Fh2><a href=\"#\">All trips<\u002Fa><\u002Fdiv>\n<div class=\"stops\" aria-hidden=\"true\"><span class=\"now\"><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n<div class=\"tgrid\" id=\"tripGrid\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"tell\" data-screen-label=\"Where we tell it\">\n<div class=\"wrap\">\n<h2 class=\"h2dot\">Where we tell it<\u002Fh2>\n<div class=\"cgrid\">\n<div class=\"chan\"><div class=\"ph\"><image-slot id=\"chan-youtube\" shape=\"rect\" placeholder=\"Latest video thumbnail\"><\u002Fimage-slot><\u002Fdiv><div class=\"ic\"><svg width=\"48\" height=\"48\" viewBox=\"116 46 36 36\" aria-hidden=\"true\"><circle cx=\"134\" cy=\"64\" r=\"18\" fill=\"#E3A21A\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div class=\"label lbl\">YouTube<\u002Fdiv><h3>The vlogs<\u002Fh3><p>The whole trip, wrong turns included. Watch us get lost and find the tea stall.<\u002Fp><a href=\"#\">[@CHANNEL] on YouTube<\u002Fa><\u002Fdiv>\n<div class=\"chan\"><div class=\"ph\"><image-slot id=\"chan-instagram\" shape=\"rect\" placeholder=\"Latest Instagram post\"><\u002Fimage-slot><\u002Fdiv><div class=\"ic\"><svg width=\"55\" height=\"55\" viewBox=\"16 16 168 168\" aria-hidden=\"true\"><path d=\"M176 80V24H24V176H176V136\" fill=\"none\" stroke=\"#23325E\" stroke-width=\"16\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div class=\"label lbl\">Instagram<\u002Fdiv><h3>The scroll<\u002Fh3><p>Every photo in its frame. Scroll the grid and it reads like one long painting.<\u002Fp><a href=\"#\">[@HANDLE] on Instagram<\u002Fa><\u002Fdiv>\n<div class=\"chan\"><div class=\"ph\"><image-slot id=\"chan-blog\" shape=\"rect\" placeholder=\"Latest story cover\"><\u002Fimage-slot><\u002Fdiv><div class=\"ic\"><svg width=\"51\" height=\"19\" viewBox=\"40 100 154 58\" aria-hidden=\"true\"><path d=\"M48 150C80 150 96 108 130 108H140\" fill=\"none\" stroke=\"#C9372C\" stroke-width=\"16\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"164\" cy=\"108\" r=\"8\" fill=\"#C9372C\"><\u002Fcircle><circle cx=\"186\" cy=\"108\" r=\"8\" fill=\"#C9372C\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div class=\"label lbl\">Blog<\u002Fdiv><h3>The long version<\u002Fh3><p>Written up after we're home. The places, the people, and the tips worth passing on.<\u002Fp><a href=\"Stories.html\">Read the blog<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"scroll\" id=\"stories\" data-screen-label=\"The scroll\">\n<div class=\"wrap\">\n<div>\n<span class=\"tag\">Pattachitra<\u002Fspan>\n<h2 class=\"disp\">One panel of an endless scroll.<\u002Fh2>\n<p>A Patua painter tells a story panel by panel along a long scroll of cloth. We tell ours the same way. One trip, one frame, and the route always walks out the side toward the next one.<\u002Fp>\n<p>Every story opens with its trip number, so every post, reel and video joins the same scroll.<\u002Fp>\n<p style=\"margin-top:24px\"><a href=\"Stories.html\">Read the stories<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<div class=\"panels\">\n<div><image-slot id=\"panel-a\" shape=\"rect\" placeholder=\"Trip photo\"><\u002Fimage-slot><span class=\"tag n\">Trip 10<\u002Fspan><\u002Fdiv>\n<div><image-slot id=\"panel-b\" shape=\"rect\" placeholder=\"Trip photo\"><\u002Fimage-slot><span class=\"tag n\">Trip 11<\u002Fspan><\u002Fdiv>\n<div><image-slot id=\"panel-c\" shape=\"rect\" placeholder=\"Trip photo\"><\u002Fimage-slot><span class=\"tag n\">Trip 12<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section class=\"join\" id=\"join\" data-screen-label=\"Join\">\n<div class=\"wrap\">\n<div><h2 class=\"disp\">Come on the next one.<\u002Fh2><p>Trip 13 is being planned. Tell us you're in and we'll send the details.<\u002Fp><\u002Fdiv>\n<a class=\"btn\" href=\"#\">Join a trip<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n<footer class=\"on-indigo\">\n<div class=\"wrap\">\n<div class=\"top\">\n<div><img class=\"flogo\" src=\"1ab4aff5-a5f9-45d3-becf-c24b9c90ed20\" alt=\"Never Ending Trail Club · নেভার এন্ডিং ট্রেল ক্লাব\"><\u002Fdiv>\n<div><div class=\"label h\">Club<\u002Fdiv><ul><li><a href=\"#trips\">Trips<\u002Fa><\u002Fli><li><a href=\"Stories.html\">Stories<\u002Fa><\u002Fli><li><a href=\"About.html\">About us<\u002Fa><\u002Fli><li><a href=\"Join.html\">Join a trip<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<div><div class=\"label h\">Follow<\u002Fdiv><ul><li><a href=\"#\">Instagram<\u002Fa><\u002Fli><li><a href=\"#\">YouTube<\u002Fa><\u002Fli><li><a href=\"#\">Facebook<\u002Fa><\u002Fli><\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"bot\"><span>Travel · Stories · Friends<\u002Fspan><span class=\"label\">Trip 12 and counting<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n<script>\nconst trips=[11,10,9];\ndocument.getElementById('tripGrid').innerHTML=trips.map(n=>{const nn=String(n).padStart(2,'0');return `<article class=\"tcard\" id=\"trip-${nn}\"><div class=\"ph\"><image-slot id=\"trip-${nn}-photo\" shape=\"rect\" placeholder=\"Trip ${nn} photo\"><\u002Fimage-slot><\u002Fdiv><div class=\"bd\"><span class=\"tag\">Trip ${nn} · [Place]<\u002Fspan><h3>[Trip title, sentence case]<\u002Fh3><p>[One line on what happened. Place first, then the moment.]<\u002Fp><a href=\"Story.html\">Read the story<\u002Fa><\u002Fdiv><\u002Farticle>`}).join('');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
